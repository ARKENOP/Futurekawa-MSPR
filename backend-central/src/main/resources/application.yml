# ==============================================================================
# FutureKawa Backend Central — Application Configuration
# ==============================================================================
# All values use ${ENV_VAR} placeholders resolved from the .env file
# via Docker Compose environment injection.
# ==============================================================================

spring:
  application:
    name: backend-central

  # ── Jackson 2 ────────────────────────────────────────────────────────────
  # This app uses the Jackson 2 API (spring-boot-jackson2). In Spring Boot 4
  # the plain `spring.jackson.*` keys target Jackson 3, so Jackson 2 config
  # lives under `spring.jackson2.*`.
  #
  # IMPORTANT: unlike backend-local, default-property-inclusion stays ALWAYS
  # (not non_null). frontend-web/src/types/api.ts types nullable fields as
  # `T | null` and expects them present in the JSON, not omitted.
  jackson2:
    serialization:
      write-dates-as-timestamps: false

  # Use Jackson 2 for HTTP message conversion so @JsonProperty is honoured.
  http:
    converters:
      preferred-json-mapper: jackson2

  # ── Pagination defaults ──────────────────────────────────────────────────
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # ── Security: Keycloak OIDC JWT validation ───────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/futurekawa}

# ── Server ─────────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: framework

# ── Actuator ───────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ── Springdoc / Swagger UI ─────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ══════════════════════════════════════════════════════════════════════════════
# Custom application properties (bound via @ConfigurationProperties)
# ══════════════════════════════════════════════════════════════════════════════

futurekawa:
  # ── Registre des backends locaux ─────────────────────────────────────────
  # Un local par pays. codePays doit correspondre au codePays que le local
  # renvoie lui-même sur GET /api/v1/pays (vérifié au démarrage).
  locals:
    - code-pays: BR
      url: ${LOCAL_BR_URL:http://localhost:8081}
    - code-pays: EC
      url: ${LOCAL_EC_URL:http://localhost:8082}
    - code-pays: CO
      url: ${LOCAL_CO_URL:http://localhost:8083}

  # ── Découverte périodique des pays (nomPays, seuils) ─────────────────────
  discovery:
    fixed-delay-ms: ${DISCOVERY_FIXED_DELAY_MS:60000}

  # ── Client HTTP vers les locaux ──────────────────────────────────────────
  client:
    connect-timeout-ms: ${LOCAL_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${LOCAL_READ_TIMEOUT_MS:5000}

# ── Resilience4j: config par défaut, un CircuitBreaker par codePays créé à la volée ──
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.futurekawa: DEBUG
