name: FutureKawa CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-local:
    name: Build, Test & Package Backend Local
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 1. Build, Tests automatisés et Qualité (Maven)
      - name: Build and test with Maven
        run: mvn -B clean verify

      # 2. Packaging (Image Docker)
      - name: Build Docker Image
        run: docker build -t futurekawa/backend-local:latest -f Dockerfile .

      # 3. Mise à disposition d'artefacts (.jar compilé)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-local-jar
          path: backend-local/target/*.jar
          retention-days: 5

  backend-central:
    name: Build, Test & Package Backend Central
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-central

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 1. Build, Tests automatisés et Qualité (Maven)
      - name: Build and test with Maven
        run: mvn -B clean verify

      # 2. Packaging (Image Docker)
      - name: Build Docker Image
        run: docker build -t futurekawa/backend-central:latest -f Dockerfile .

      # 3. Mise à disposition d'artefacts (.jar compilé)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-central-jar
          path: backend-central/target/*.jar
          retention-days: 5

  frontend:
    name: Build, Quality & Package Frontend Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 1. Build dependencies
      - name: Install dependencies
        run: pnpm install

      # 2. Vérification Qualité (Linter & Typecheck)
      - name: Code Quality (Lint & Typecheck)
        run: |
          pnpm run lint
          pnpm run typecheck

      # 3. Packaging (Compilation pour le Web)
      - name: Build production files
        run: pnpm run build

      # 4. Mise à disposition d'artefacts (Dossier /dist exploitable)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-web/dist/
          retention-days: 5
