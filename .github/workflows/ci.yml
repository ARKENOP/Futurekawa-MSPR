name: FutureKawa CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  # ── Java: one Maven reactor builds futurekawa-lib + both backends ───────────
  # The two services share the futurekawa-lib module, so they are built together
  # from the root pom instead of once per directory.
  backends:
    name: Build, Test & Package Java Backends
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 1. Build, automated tests and quality gates (Maven).
      #    backend-local enforces an 80% JaCoCo line-coverage gate during `verify`.
      - name: Build and test the whole reactor
        run: mvn -B clean verify

      # 2. Packaging (Docker images, built from source at the repository root)
      - name: Build backend-local image
        run: docker build -t futurekawa/backend-local:latest -f backend-local/Dockerfile.prod .

      - name: Build backend-central image
        run: docker build -t futurekawa/backend-central:latest -f backend-central/Dockerfile.prod .

      # 3. Publish the compiled artefacts
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: futurekawa-backend-jars
          path: |
            futurekawa-lib/target/*.jar
            backend-local/target/backend-local-*.jar
            backend-central/target/backend-central-*.jar
          retention-days: 5

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            backend-local/target/site/jacoco/**
            backend-central/target/site/jacoco/**
          retention-days: 5

  frontend:
    name: Build, Quality & Package Frontend Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 1. Build dependencies
      - name: Install dependencies
        run: pnpm install

      # 2. Quality checks (linter & typecheck)
      - name: Code Quality (Lint & Typecheck)
        run: |
          pnpm run lint
          pnpm run typecheck

      # 3. Packaging (web build)
      - name: Build production files
        run: pnpm run build

      # 4. Publish the deployable /dist folder
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-web/dist/
          retention-days: 5
