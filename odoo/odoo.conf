; Configuration serveur Odoo, montée en lecture seule par docker-compose.siege.yml.
; Les identifiants de base ne sont pas ici : l'image les injecte depuis les
; variables HOST / PORT / USER / PASSWORD définies dans le Compose.
;
; CHANGER admin_passwd AVANT TOUT DÉPLOIEMENT RÉEL : ce mot de passe maître
; autorise la création, la duplication et la suppression des bases.

[options]
admin_passwd = changeme-odoo-master-password

; Le module FutureKawa est monté dans /mnt/extra-addons.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

data_dir = /var/lib/odoo

; Les backends sélectionnent la base par son nom en JSON-RPC.
list_db = True

; workers > 0 exigerait de publier et relayer le port longpolling (8072).
workers = 0

proxy_mode = True

log_level = info
