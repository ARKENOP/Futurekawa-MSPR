# ==============================================================================
# FutureKawa — Mosquitto broker configuration (country-local stack)
# ==============================================================================
listener 1883 0.0.0.0

# The broker is on a private country LAN; the on-site serial bridge publishes
# anonymously. For a hardened deployment, disable anonymous access and enable a
# password file (see the two commented lines below).
allow_anonymous true
# allow_anonymous false
# password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
