# ==============================================================================
# FutureKawa — Country-local PRODUCTION stack
# ==============================================================================
# Deploys an entire country: PostgreSQL + Mosquitto broker + backend-local.
# Odoo/ERP is NOT here — it lives in the siège (backend-central) stack.
#
#   Deploy:   cp .env.prod.example .env   # then edit for the country
#             docker compose -f docker-compose.prod.yml up -d --build
#
# Per-country values + credentials live in .env.
# Docker-network wiring (hostnames/ports) lives here — identical for every
# country, so it stays out of .env. The `environment:` block wins over
# `env_file`, so the wiring below always points at the in-stack containers.
# ==============================================================================

name: futurekawa-local

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: futurekawa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futurekawa}
      POSTGRES_USER: ${POSTGRES_USER:-futurekawa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Not published to the host: the DB is only reached over the compose network.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-futurekawa} -d ${POSTGRES_DB:-futurekawa}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Mosquitto MQTT broker ────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: futurekawa-mosquitto
    restart: unless-stopped
    # 1883 is published so the on-site serial bridge / IoT devices can publish.
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  # ── Backend Local (Spring Boot) ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: futurekawa/backend-local:latest
    container_name: futurekawa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file:
      - .env
    environment:
      # Docker-network wiring — overrides whatever .env carries.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MQTT_BROKER_URL: tcp://mosquitto:1883
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
