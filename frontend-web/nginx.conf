# Sert le bundle Vite en SPA et relaie /api/v1 vers backend-central, pour que le
# navigateur ne voie qu'une seule origine (équivalent du proxy Vite en dev).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les assets Vite sont hachés donc immuables ; index.html ne doit jamais
    # être mis en cache, sinon le navigateur garde un bundle périmé.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/v1/ {
        # Résolution DNS Docker par variable, et non via un bloc `upstream` :
        # nginx refuse de démarrer si l'hôte amont est inconnu, ce qui ferait
        # boucler ce conteneur dès que backend-central est arrêté.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_central http://backend-central:8090;

        # proxy_pass avec une variable ne réécrit pas l'URI, d'où $request_uri.
        proxy_pass $backend_central$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
